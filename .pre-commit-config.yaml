# Pre-commit hooks configuration
# Install: make pre-commit-install
# Run manually: pre-commit run --all-files

repos:
  # Run the project CI gate via make
  - repo: local
    hooks:
      - id: make-ci
        name: make ci
        description: Run format-check, lint, typecheck, and tests via Makefile
        entry: bash -c 'RUFF_CACHE_DIR=/tmp/ruff-cache MYPY_CACHE_DIR=/tmp/mypy-cache PYTEST_ADDOPTS="-p no:cacheprovider" make ci'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Additional quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        description: Remove trailing whitespace

      - id: end-of-file-fixer
        name: fix end of files
        description: Ensure files end with newline

      - id: check-yaml
        name: check yaml
        description: Validate YAML files

      - id: check-toml
        name: check toml
        description: Validate TOML files

      - id: check-added-large-files
        name: check for large files
        description: Prevent large files from being committed
        args: [--maxkb=500]

      - id: check-merge-conflict
        name: check for merge conflicts
        description: Check for merge conflict markers

      - id: check-case-conflict
        name: check filename case conflicts
        description: Check for case conflicts in filenames

# Global settings
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Performance optimization
minimum_pre_commit_version: '3.0.0'
